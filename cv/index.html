  <main class="resume-main">
    <div class="resume-intro">

    <div class="resume-actions" role="group" aria-label="Resume actions">
      <a class="btn btn-primary" id="resumeDownload"

        data-magnetic>

            <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71" />
            <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71" />

      <div class="resume-embed resume-embed--desktop">
        <iframe
          title="Avijit Goswami resume PDF"
          src="https://kqfazxygftmujpjerlce.supabase.co/storage/v1/object/public/assets/Avijit_Goswami_Resume.pdf#toolbar=0&navpanes=0&view=FitH"
          loading="lazy"></iframe>

        <a class="btn btn-primary"

          target="_blank" rel="noopener noreferrer">
          <span class="btn-text">Open PDF</span>

  <div class="toast" id="toast" role="alert" aria-live="polite">
    <div class="toast-icon" id="toastIcon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M20 6L9 17l-5-5" />
      </svg>
    </div>
    <div class="toast-body">
      <span class="toast-title" id="toastTitle">Copied</span>
      <span class="toast-msg" id="toastMsg">Share link ready</span>
    </div>
    <button class="toast-close" id="toastClose" aria-label="Dismiss notification">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M18 6L6 18M6 6l12 12" />
      </svg>
    </button>
    <div class="toast-progress" id="toastProgress"></div>
  </div>

  <script>
    (() => {
      'use strict';
      const SHARE_URL = 'https://avijitgoswami.in/cv';
      const PDF_URL = 'https://kqfazxygftmujpjerlce.supabase.co/storage/v1/object/public/assets/Avijit_Goswami_Resume.pdf';
      const PDF_FILENAME = 'Avijit_Goswami_Resume.pdf';
      const toast = document.getElementById('toast');
      const toastTitle = document.getElementById('toastTitle');
      const toastMsg = document.getElementById('toastMsg');
      const toastClose = document.getElementById('toastClose');
      const toastProgress = document.getElementById('toastProgress');
      let toastTimer = null;

      function showToast(title, msg, isError) {
        clearTimeout(toastTimer);
        toast.classList.remove('visible', 'toast-exit', 'toast-error');
        toastProgress.style.animation = 'none';
        void toast.offsetWidth;
        if (isError) toast.classList.add('toast-error');
        toastTitle.textContent = title;
        toastMsg.textContent = msg;
        toast.classList.add('visible');
        toastProgress.style.animation = 'toastCountdown 4s linear forwards';
        toastTimer = setTimeout(dismissToast, 4200);
      }

      function dismissToast() {
        clearTimeout(toastTimer);
        toast.classList.add('toast-exit');
        setTimeout(() => toast.classList.remove('visible', 'toast-exit', 'toast-error'), 400);
      }

      if (toastClose) toastClose.addEventListener('click', dismissToast);

      async function copyShareLink() {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(SHARE_URL);
          } else {
            const input = document.createElement('input');
            input.value = SHARE_URL;
            input.setAttribute('readonly', '');
            input.style.position = 'absolute';
            input.style.left = '-9999px';
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
          }
          showToast('Link copied', SHARE_URL);
        } catch (err) {
          showToast('Copy failed', 'Select and copy: ' + SHARE_URL, true);
        }
      }

      async function downloadPdf(event) {
        event.preventDefault();
        try {
          const res = await fetch(PDF_URL);
          if (!res.ok) throw new Error('fetch failed');
          const blob = await res.blob();
          const objectUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = objectUrl;
          a.download = PDF_FILENAME;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(objectUrl);
        } catch (err) {
          window.open(PDF_URL, '_blank', 'noopener,noreferrer');
        }
      }

      const copyBtn = document.getElementById('resumeCopyLink');
      if (copyBtn) copyBtn.addEventListener('click', copyShareLink);

      const downloadBtn = document.getElementById('resumeDownload');
      if (downloadBtn) downloadBtn.addEventListener('click', downloadPdf);
    })();
  </script>
